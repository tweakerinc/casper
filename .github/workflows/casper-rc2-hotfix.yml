name: Casper RC2.1 hotfix validation
on:
  push:
    branches: [fix/casper-stability-v0.2.0-candidate]
    paths: [.github/workflows/casper-rc2-hotfix.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: casper-rc2-hotfix
  cancel-in-progress: false
jobs:
  sources:
    if: github.ref == 'refs/heads/fix/casper-stability-v0.2.0-candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.apply.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/casper-stability-v0.2.0-candidate
          fetch-depth: 0
      - name: Verify exact patch, test actual HAL and commit source
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma
          data = base64.b64decode(Path('.github/candidate-patches/rc2-hotfix.b64').read_text().strip(), validate=True)
          expected = '2f7fe7ac177f800d89c2ee965f8a371c1f4477d7561f9257a9ea476de3fa7953'
          assert hashlib.sha256(data).hexdigest() == expected, 'Patch checksum mismatch'
          patch = lzma.decompress(data)
          assert len(patch) == 23350
          Path('/tmp/rc2-hotfix.patch').write_bytes(patch)
          PY
          git apply --check --index /tmp/rc2-hotfix.patch
          git apply --index /tmp/rc2-hotfix.patch
          # This runner has contents permission only; workflow edits are applied
          # separately through the owner's connector, not this credential.
          git restore --source=HEAD --staged --worktree .github/workflows/casper-candidate.yml
          git diff --cached --check
          python3 tools/rc2_hotfix_tests/run_tests.py
          git rm .github/candidate-patches/rc2-hotfix.b64
          git -c user.name='Casper candidate builder' -c user.email='github-actions[bot]@users.noreply.github.com' commit -m 'fix(candidate): RC2.1 safe storage cleanup and bounded cover failure retries' -m 'Fix the reported X3 HalFile::close assertion on reader entry. Retain real I/O error checks, test actual HAL plus paged/index owners, and stop repeated no-progress cover generation. UI geometry, Rivulet layout and indexing formats are unchanged. Specific failing JPEG remains unverified; device test candidate only.'
          git push origin HEAD:refs/heads/fix/casper-stability-v0.2.0-candidate
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  host-tests:
    needs: sources
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.sources.outputs.sha }}
          submodules: recursive
          persist-credentials: false
      - name: Run complete suite and actual-source sanitizers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hotfix-tests
          git rev-parse HEAD > hotfix-tests/commit.txt
          cmake -S test -B /tmp/casper-tests -DCMAKE_BUILD_TYPE=Debug 2>&1 | tee hotfix-tests/configure.log
          cmake --build /tmp/casper-tests -j2 2>&1 | tee hotfix-tests/compile.log
          ctest --test-dir /tmp/casper-tests --output-on-failure 2>&1 | tee hotfix-tests/ctest.log
          python3 tools/casper_stability/run_tests.py 2>&1 | tee hotfix-tests/rivulet.log
          python3 tools/rc2_hotfix_tests/run_tests.py 2>&1 | tee hotfix-tests/hal-hotfix.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: casper-rc2.1-tests
          path: hotfix-tests/
          retention-days: 14
  build:
    needs: sources
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.sources.outputs.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: casper-c3-pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'scripts/patch_wolfssl.py') }}
          restore-keys: casper-c3-pio-${{ runner.os }}-
      - name: Install build tools
        run: python3 -m pip install platformio==6.1.18
      - name: Compile and package X3/X4 firmware
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hotfix-build
          git rev-parse HEAD > hotfix-build/commit.txt
          git submodule status --recursive > hotfix-build/submodules.txt
          printf '%s\n' "$GITHUB_RUN_ID" > hotfix-build/run.txt
          cp docs/releases/v0.2.0-rc2.1-test.md hotfix-build/README.md
          touch platformio.local.ini
          pio run -e default 2>&1 | tee hotfix-build/build.log
          cp .pio/build/default/firmware.bin hotfix-build/Casper-v0.2.0-rc2.1.bin
          cp .pio/build/default/firmware.elf hotfix-build/Casper-v0.2.0-rc2.1.elf
          sha256sum hotfix-build/Casper-v0.2.0-rc2.1.bin > hotfix-build/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: casper-rc2.1-build
          path: hotfix-build/
          retention-days: 14
