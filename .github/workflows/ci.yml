name: CI (build)

# Casper: full CrossInk CI (self-hosted runner + strict format) is not required
# for this personal repo. Firmware checks only run when C++/build files change;
# README/docs/image-only pushes skip CI so the repo home stays green.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "images/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "images/**"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Lightweight gate so "CI (build)" still reports success when code changes.
  # Re-enable clang-format / cppcheck / PlatformIO build when you have a runner
  # and want strict upstream-style checks again.
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Confirm firmware tree present
        run: |
          set -euo pipefail
          test -f platformio.ini
          test -d src
          echo "Sanity OK (docs-only commits skip this workflow via paths-ignore)."
