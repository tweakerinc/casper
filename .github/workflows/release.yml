name: Compile Release
on:
  push:
    tags:
      - '*'
  # Manual re-run without retagging (uses current default branch tip if dispatched).
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Build Casper release
        # gh_release must inherit base pre-scripts (gen_i18n, wolfssl patch, …).
        # See platformio.ini [env:gh_release] extra_scripts comment.
        run: |
          set -euo pipefail
          pio run -e gh_release | tee pio-release.log
          ls -la .pio/build/gh_release/firmware.bin
          ls -la dist/Casper-*.bin

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Casper-${{ github.ref_name }}
          path: |
            dist/Casper-*.bin
            .pio/build/gh_release/bootloader.bin
            .pio/build/gh_release/firmware.bin
            .pio/build/gh_release/firmware.elf
            .pio/build/gh_release/firmware.map
            .pio/build/gh_release/partitions.bin
          if-no-files-found: error