; Nova — greenfield Casper application (no CrossPoint product src).
; Build from this directory: platformio run -e default

[platformio]
default_envs = default
src_dir = src
lib_dir = lib

[nova]
version = v0.0.1

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.offset_address = 0x10000

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -std=gnu++2a
  -DUSE_UTF8_LONG_NAMES=1
  -DNOVA_VERSION=\"${nova.version}\"
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -DFREEINK_CAP_BLE_HID_HOST=0
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
  -fno-exceptions
  -Wno-bidi-chars

build_unflags =
  -std=gnu++11
  -fexceptions

; Shared infrastructure only (not CrossPoint activities / settings / themes).
lib_extra_dirs =
  ../lib
  ../freeink-sdk/libs/hardware
  ../freeink-sdk/libs/display
  ../freeink-sdk/libs/network
  ../freeink-sdk/libs/ui
  ../freeink-sdk/libs/assets

lib_deps =
  bblanchon/ArduinoJson @ 7.4.2

; Keep the tree lean — do not pull CrossPoint-era product libs.
lib_ignore =
  I18n
  KOReaderSync
  Epub
  Txt
  Xtc
  OpdsParser
  JpegToBmpConverter
  PngToBmpConverter
  FreeInkBook
  FreeInkUI
  BleKeyboardHost
  ContentProtection
  NearbyTransfer
  BLE
  NimBLE-Arduino

[env:default]
extends = base
